name: Build Android APK

on:
  push:
    branches: ["arena/**", master, main]
    paths:
      - "python-android/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.variant.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant:
          - name: universal
            abis: "arm64-v8a,armeabi-v7a"
            ffmpeg-abis: "arm64-v8a armeabi-v7a"
          - name: arm64
            abis: "arm64-v8a"
            ffmpeg-abis: "arm64-v8a"

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python 3.11 (Chaquopy buildPython)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Android SDK components
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "platforms;android-35" "build-tools;35.0.0" "platform-tools" > /dev/null
          echo "ANDROID_HOME=$ANDROID_HOME"

      - name: Bundle static ffmpeg executables (jniLibs)
        run: |
          set -e
          BASE=python-android/app/src/main/jniLibs
          # Fully-static ffmpeg builds (glibc): run on Android for local
          # video/audio merging done by yt-dlp.
          curl -fsSL -o /tmp/ff-arm64.tar.xz \
            https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-arm64-static.tar.xz
          tar -xJf /tmp/ff-arm64.tar.xz -C /tmp
          mkdir -p "$BASE/arm64-v8a"
          cp /tmp/ffmpeg-*-arm64-static/ffmpeg "$BASE/arm64-v8a/libffmpeg.so"
          chmod +x "$BASE/arm64-v8a/libffmpeg.so"
          file "$BASE/arm64-v8a/libffmpeg.so"
          if echo "${{ matrix.variant.ffmpeg-abis }}" | grep -q armeabi-v7a; then
            curl -fsSL -o /tmp/ff-armhf.tar.xz \
              https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-armhf-static.tar.xz
            tar -xJf /tmp/ff-armhf.tar.xz -C /tmp
            mkdir -p "$BASE/armeabi-v7a"
            cp /tmp/ffmpeg-*-armhf-static/ffmpeg "$BASE/armeabi-v7a/libffmpeg.so"
            chmod +x "$BASE/armeabi-v7a/libffmpeg.so"
            file "$BASE/armeabi-v7a/libffmpeg.so"
          fi

      - name: Set up Gradle 8.9
        run: |
          curl -fsSL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q /tmp/gradle.zip -d "$RUNNER_TEMP"

      - name: Build release APK
        env:
          NEWYT_ABIS: ${{ matrix.variant.abis }}
        run: |
          "$RUNNER_TEMP/gradle-8.9/bin/gradle" -p python-android assembleRelease --no-daemon --stacktrace
          cp python-android/app/build/outputs/apk/release/app-release.apk \
             "YTDownloaderXPro-1.0-${{ matrix.variant.name }}.apk"
          ls -lh "YTDownloaderXPro-1.0-${{ matrix.variant.name }}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ matrix.variant.name }}
          path: YTDownloaderXPro-1.0-${{ matrix.variant.name }}.apk
          compression-level: 0
          if-no-files-found: error
